<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" role="img" aria-label="Center Gráfica">
  <defs>
    <linearGradient id="centerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#002D9C" />
    </linearGradient>
    <linearGradient id="cmykAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#E6007E" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
  </defs>
  <!-- Icon mark inspired by @centergrafica logo -->
  <rect x="4" y="8" width="54" height="54" rx="14" fill="url(#centerBlue)" />
  <rect x="13" y="17" width="36" height="36" rx="8" stroke="#FFFFFF" stroke-width="4.5" />
  <circle cx="49" cy="15" r="5" fill="#E6007E" />
  <!-- Typography -->
  <text x="70" y="40" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="31" letter-spacing="0.5" fill="currentColor">CENTER</text>
  <text x="148" y="61" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="1.2" fill="#0052FF">gráfica</text>
  <rect x="70" y="50" width="70" height="4" rx="2" fill="url(#cmykAccent)" />
</svg>
