<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Center Gráfica — Símbolo 3D</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 40%, #f4f7ff 0%, #dfe6f5 100%);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    .logo-3d-stage {
      width: min(520px, 90vw);
      aspect-ratio: 1 / 1;
      position: relative;
    }
    .logo-3d-stage canvas,
    .logo-3d-stage svg { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main>
    <div id="logo-3d-stage" class="logo-3d-stage" role="img" aria-label="Símbolo da Center Gráfica em 3D"></div>
  </main>
  <script type="module" src="js/logo-3d.js"></script>
</body>
</html>
